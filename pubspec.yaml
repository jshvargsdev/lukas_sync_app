name: lukas_sync_app
description: "Conversor de monedas para Venezuela: BCV, Binance P2P y tasas personalizadas."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E2F1F1"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  color: "#E2F1F1"
  image: "assets/icon.png"
  color_dark: "#0F172A"
  image_dark: "assets/icon.png"
  android_12:
    color: "#E2F1F1"
    image: "assets/icon.png"
    icon_background_color: "#E2F1F1"
    color_dark: "#0F172A"
    image_dark: "assets/icon.png"
    icon_background_color_dark: "#0F172A"
  android: true
  ios: true
  web: false
